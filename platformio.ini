[env:disco_f469ni]
platform = ststm32
board = disco_f469ni
framework = stm32cube

monitor_speed = 115200

upload_protocol = stlink

upload_flags =
    -f
    interface/stlink.cfg
    -f
    target/stm32f4x.cfg

upload_command = $PROJECT_PACKAGES_DIR/tool-openocd/bin/openocd $UPLOAD_FLAGS -c "program {$SOURCE} verify reset exit"

; Pulls the exact LVGL library directly into your project via the registry
lib_deps = 
    lvgl/lvgl@^9.1.0
    lib/stm32_bsp

; Include path for lv_conf.h (required by LVGL)
; Disable ASM-optimized blend routines — Cortex-M4 has no Helium/NEON ASM support in this LVGL build
; Skip SDRAM init inside LCD driver (we call it explicitly from main.c)
; THIS BOARD HAS AN 8 MHz HSE CRYSTAL (revC). The framework hardcodes 25 MHz, which makes HAL
; report a bogus 562.5 MHz SYSCLK: SysTick ticks stretch to 3.125 ms wall time and HAL_DSI_Init
; computes an out-of-spec DSI PHY bit period. Override it here — see docs/Learnings.md.
build_flags = 
    -I.
    -DLV_USE_DRAW_SW_ASM=0
    -DDATA_IN_ExtSDRAM
    -DHSE_VALUE=8000000UL
    ; -DUSE_STM32469I_DISCO_REVB
