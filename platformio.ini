[env:disco_f469ni]
platform = ststm32
board = disco_f469ni
framework = stm32cube

; Pulls the exact LVGL library directly into your project via the registry
lib_deps = 
    lvgl/lvgl@^9.1.0

; Include path for lv_conf.h (required by LVGL)
; Disable ASM-optimized blend routines — Cortex-M4 has no Helium/NEON ASM support in this LVGL build
build_flags = 
    -I.
    -DLV_USE_DRAW_SW_ASM=0

